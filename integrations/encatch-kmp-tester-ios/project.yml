name: EncatchKmpTester
options:
  bundleIdPrefix: com.encatch
  deploymentTarget:
    iOS: "16.0"

targets:
  EncatchKmpTesterApp:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - framework: ../encatch-kmp-tester/build/XCFrameworks/debug/EncatchKmpTester.xcframework
        embed: true
        codeSign: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Encatch KMP Tester"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.encatch.kmptester.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  EncatchKmpTesterApp:
    build:
      targets:
        EncatchKmpTesterApp: all
    run:
      config: Debug
    archive:
      config: Release
