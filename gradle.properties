org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Needed for :kmp-sdk's iosMain intermediate source set to see the EncatchBridge cinterop klib
# during its own metadata compile (compileIosMainKotlinMetadata, part of `:kmp-sdk:build`) — without
# this, only the leaf iosArm64Main/iosSimulatorArm64Main compiles (which each have their own
# per-target cinterop klib) can resolve com.encatch.bridge.*. See
# https://kotlinlang.org/docs/mpp-share-on-platforms.html#use-native-libraries-in-the-hierarchical-structure
kotlin.mpp.enableCInteropCommonization=true
