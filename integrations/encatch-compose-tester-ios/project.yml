name: EncatchComposeTester
options:
  bundleIdPrefix: com.encatch
  deploymentTarget:
    iOS: "16.0"

targets:
  EncatchComposeTesterApp:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - framework: ../encatch-compose-tester/build/XCFrameworks/debug/EncatchComposeTester.xcframework
        embed: true
        codeSign: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Encatch Compose Tester"
        UILaunchScreen: {}
        # Developer-local Setup-screen defaults, expanded from build settings at build time
        # (scripts pass ENCATCH_DEV_API_KEY/ENCATCH_DEV_FORM_ID from the git-ignored root
        # dev-tester-defaults.properties; unset -> empty string, Setup starts blank).
        EncatchDevApiKey: "$(ENCATCH_DEV_API_KEY)"
        EncatchDevFormId: "$(ENCATCH_DEV_FORM_ID)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The form's video/audio recording questions use getUserMedia — iOS kills the app
        # outright if these usage strings are missing when capture starts.
        NSCameraUsageDescription: "Used to record video feedback in forms."
        NSMicrophoneUsageDescription: "Used to record audio feedback in forms."
        # Required by Compose Multiplatform's iOS UIKit target — without it,
        # ComposeUIViewController's PlistSanityCheck aborts the process on iPhone.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.encatch.composetester.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Free (non-paid) Apple ID — automatic signing lets Xcode create/manage the dev
        # provisioning profile against devices connected to this Mac. No Ad Hoc/TestFlight
        # export is possible without a paid Apple Developer Program membership. Build/install to
        # a real device via Xcode itself (Product > Run with the device selected) — Apple's
        # automatic-signing handshake requires an interactive Xcode session and doesn't work
        # from a plain `xcodebuild` CLI invocation on a free account.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F727LM57W2

schemes:
  EncatchComposeTesterApp:
    build:
      targets:
        EncatchComposeTesterApp: all
    run:
      config: Debug
    archive:
      config: Release
