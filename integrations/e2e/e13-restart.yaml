# E13 (RN SDK 1.5.0 doc): identify, then restart the app without clearing its data.
# Run by integrations/e2e/run-e13.sh, which checks the requests the mock-server recorded.
#   APP_ID   com.encatch.androidtester (Android) or com.encatch.iostester (iOS)
#   PERSIST  "true" (the default) or "false" (Setup's "Keep the user after an app restart" off)
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Encatch Tester"
    timeout: 20000
- tapOn: "Mock"
- tapOn: "en_dev_…"
- inputText: "e2e-api-key"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- tapOn:
    text: "form id"
    index: 0
- inputText: "e2e-form"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      true: ${PERSIST == "false"}
    commands:
      - scrollUntilVisible:
          element: "Keep the user after an app restart"
      - tapOn: "Keep the user after an app restart"
- scrollUntilVisible:
    element: "Save & continue"
- tapOn: "Save & continue"
- extendedWaitUntil:
    visible: "Encatch.isIdentified(): no"
    timeout: 15000
- tapOn: ".*New user"
- tapOn: "Username"
- inputText: "e2e-alice"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- tapOn: "Save user"
- scrollUntilVisible:
    element: "Identify user"
- tapOn: "Identify user"
- extendedWaitUntil:
    visible: "Encatch.isIdentified(): yes"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
# the second launch: same device data, a new app run
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Log in"
    timeout: 20000
- runFlow:
    when:
      true: ${PERSIST == "false"}
    commands:
      - extendedWaitUntil:
          visible: "Encatch.isIdentified(): no"
          timeout: 10000
- runFlow:
    when:
      true: ${PERSIST != "false"}
    commands:
      - extendedWaitUntil:
          visible: "Encatch.isIdentified(): yes"
          timeout: 10000
